<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="Happy Birthday Website 2.0 | Aoudumber Bade">
    <meta name="github" content="https://github.com/Aoudumber-Bade">
    <title>Ishu Birthday</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<body>
    <div id="wrapper">
        <div class="flag__birthday">
            <img src="./images/1.png" alt="" width="350" class="flag__left">
            <img src="./images/1.png" alt="" width="350" class="flag__right">
        </div>
        <div class="content">
            <div class="left">
                <div class="title">
                    <h1 class="happy">
                        <span style="--t: 4s;">H</span>
                        <span style="--t: 4.2s;">a</span>
                        <span style="--t: 4.4s;">p</span>
                        <span style="--t: 4.6s;">p</span>
                        <span style="--t: 4.8s;">y</span>
                    </h1>
                    <h1 class="birthday">
                        <span style="--t: 5s;">B</span>
                        <span style="--t: 5.2s;">i</span>
                        <span style="--t: 5.4s;">r</span>
                        <span style="--t: 5.6s;">t</span>
                        <span style="--t: 5.8s;">h</span>
                        <span style="--t: 6s;">d</span>
                        <span style="--t: 6.2s;">a</span>
                        <span style="--t: 6.4s;">y</span>
                    </h1>
                    <div class="hat">
                        <img src="./images/hat.png" alt="" width="130">
                    </div>
                </div>
                <div class="date__of__birth">
                    <span></span>
                </div>
                <div class="btn">
                    <button id="btn__letter">
                        <div class="mail">
                            Click Here Ishu
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                    </button>

                </div>
            </div>
            <div class="right">
                <div class="box__account">
                    <div class="image">
                        <img src="./images/unnamed.png" alt="">
                    </div>
                    <div class="name">
                        <i class="fa-solid fa-heart"></i>
                        <span>Ishu</span>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="balloon_one">
                        <img width="100px" src="./images/balloon1.png" alt="">
                    </div>
                    <div class="balloon_two">
                        <img width="100px" src="./images/balloon2.png" alt="">
                    </div>
                </div>
                <div class="cricle">
                    <div class="text__cricle">
                        <span style="--i: 1;">h</span>
                        <span style="--i: 2;">a</span>
                        <span style="--i: 3;">p</span>
                        <span style="--i: 4;">p</span>
                        <span style="--i: 5;">y</span>
                        <span style="--i: 6;">-</span>
                        <span style="--i: 7;">b</span>
                        <span style="--i: 8;">i</span>
                        <span style="--i: 9;">r</span>
                        <span style="--i: 10;">t</span>
                        <span style="--i: 11;">h</span>
                        <span style="--i: 12;">d</span>
                        <span style="--i: 13;">a</span>
                        <span style="--i: 14;">y</span>
                        <span style="--i: 15;">-</span>
                    </div>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
        </div>
        <div class="decorate_star star1" style="--t: 15s;"></div>
        <div class="decorate_star star2" style="--t: 15.2s;"></div>
        <div class="decorate_star star3" style="--t: 15.4s;"></div>
        <div class="decorate_star star4" style="--t: 15.6s;"></div>
        <div class="decorate_star star5" style="--t: 15.8s;"></div>
        <div class="decorate_flower--one" style="--t: 15s;">
            <img width="20" src="./images/decorate_flower.png" alt="">
        </div>
        <div class="decorate_flower--two" style="--t: 15.3s;">
            <img width="20" src="./images/decorate_flower.png" alt="">
        </div>
        <div class="decorate_flower--three" style="--t: 15.6s;">
            <img width="20" src="./images/decorate_flower.png" alt="">
        </div>
        <div class="decorate_bottom">
            <img src="./images/decorate.png" alt="" width="100">
        </div>
        <div class="smiley__icon">
            <img src="./images/smiley_icon.png" alt="" width="100">
        </div>


        <div class="boxMail">
            <i class="fa-solid fa-xmark"></i>
            <div class="boxMail-container">
                <div class="card1">
                    <div class="userImg">
                        <img src="images/unnamed.png" alt="">
                    </div>
                    <h4 class="username">To: Ishu 💖<span class="underline"></span></h4>

                    <h3>Happy Birthday Betu</h3>
                    <div class="imageCute">
                        <img src="cute1.png" alt="">
                    </div>
                </div>
                <div class="card2">
                    <div class="card2-content">
                        <h3 class="mail-title"></h3>
                        <h2 class="mail-message"></h2>

                        <div class="imageCute2">
                            <img src="cute2.png" alt="">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
<script>
    let datetxt = "ISHU JI";
    let datatxtletter = "Happiest Birthday to you, beautiful soul! ❤️✨I hope tumhari life ka har aane wala din tumhare chehre par ek nayi smile lekar aaye. Tumhare saare dreams poore ho, tumhe woh sab mile jiski tumne kabhi khwahish ki ho, aur zindagi tumhare saath hamesha utni hi khoobsurat rahe jitni tum khud ho. You deserve all the happiness, love and little miracles this world has to offer.Aur ek baat hai jo main tumhe batana chahta hoon... Mujhe shayad flirting karna nahi aata, na hi main hamesha perfect words mein apni feelings express kar pata hoon, but I believe ki kisi ko special feel karane ke liye hamesha bade-bade words ki zaroorat nahi hoti. Kabhi-kabhi uski chhoti-chhoti baatein yaad rakhna hi sabse khoobsurat tareeka hota hai. Tumhe kya pasand hai, kya nahi, tumhara favourite outfit, tumhari little habits, tumhari allergies aur woh saari chhoti details jo shayad tum khud bhi kabhi bhool jao, main unhe yaad rakhna chahta hoon. Waise main tumhari baatein yaad rakhne ki bahut koshish karta hoon, kabhi kisi notebook ke khaali kone mein likh bhi leta hoon, lekin main woh notebook hi bhool jaata hoon. 😂 Main chahta hoon ki tumhare difficult days mein tumhe extra strong banne ki zaroorat na pade. Tumhare painful days mein tumhara khayal rakh saku, tumhari tabiyat kharab ho toh tumhare paas baith sakun, aur agar kabhi hospital ke kisi bed par tum ho, toh tumhe akela mehsoos na hone doon. Main tumhari sirf happy moments wali story ka hissa nahi banna chahta, balki un chapters mein bhi tumhare saath rehna chahta hoon jahan sab kuch thoda mushkil ho.Main chahta hoon ki tum mere saamne bina kisi hesitation ke apni har feeling express kar sako, chahe woh khushi ho, sadness ho, gussa ho ya tumhari silly si childishness. You don't always have to be okay, and you don't always have to hide your vulnerable side.Because mere liye care ka matlab sirf 'I care for you' kehna nahi hai, balki un chhoti-chhoti cheezon ko yaad rakhna hai jo tumhare chehre par smile laati hain. Shayad pyaar hamesha khoobsurat lafzon mein nahi hota, kabhi-kabhi woh kisi ki favourite cheez yaad rakhne mein, bina kahe uska mood samajhne mein aur mushkil waqt mein uska haath thaamne mein bhi hota hai.Bas hamesha khush rehna, apni smile kabhi mat khona aur kabhi ye mat bhoolna ki tum genuinely bahut special ho. I hope life tumhe utni hi khoobsurati se treat kare jitni khoobsurati se tum is duniya ka hissa ho. Happy Birthday Betu once again! ❤️🫶";
    let titleLetter = "To you";
    let charArrDate = datetxt.split('');
    let charArrDateLetter = datatxtletter.split('');
    let charArrTitle = titleLetter.split('');
    let currentIndex = 0;
    let currentIndexLetter = 0;
    let currentIndexTitle = 0;
    let date__of__birth = document.querySelector(".date__of__birth span");
    let mailTitle = document.querySelector(".mail-title");
    let mailMessage = document.querySelector(".mail-message");

    if (mailTitle) mailTitle.textContent = titleLetter;
    if (mailMessage) mailMessage.textContent = datatxtletter;
    setTimeout(function () {
        timeDatetxt = setInterval(function () {
            if (currentIndex < charArrDate.length) {
                date__of__birth.textContent += charArrDate[currentIndex];
                currentIndex++;
            }
            else {
                let i = document.createElement("i");
                i.className = "fa-solid fa-star"
                document.querySelector(".date__of__birth").prepend(i)
                document.querySelector(".date__of__birth").appendChild(i.cloneNode(true))
                clearInterval(timeDatetxt)
            }
        }, 100)
    }, 12000)

    let mailBox = document.querySelector('.mail')
    let boxmail = document.querySelector('.boxMail')
    var close = document.querySelector('.fa-xmark')
    mailBox.onclick = function () {
        mailBox.classList.toggle('active')
        boxmail.classList.add('active')
    }

    close.addEventListener('click', function () {
        boxmail.classList.remove('active')
    })
</script>

</html>
